# ===========================================================================
# Configurações da Aplicação - SA "Não Esquece!"
# Aula 01: Setup Inicial e Configurações de Ambiente
# ===========================================================================

# Nome da Aplicação no ecossistema Spring
spring.application.name=nao-esquece-api

# Porta padrão de execução do servidor Tomcat embarcado
server.port=8080

# Formato e Fuso Horário padrão para serialização de datas com Jackson
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo

